name: Ready to homolog
on:
  repository_dispatch:
    types: [hmg-ready]
  workflow_dispatch:  
env:
  ORGANIZATION:  wisemonkeys-co 
  PRODUCT:       wise-billing
  IMAGE:         ${{ github.event.client_payload.imageName }}
  TAG:           ${{ github.event.client_payload.imageTag }}
  ISSUE:         ${{ github.event.client_payload.issue }}

jobs:
  upgrade-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Token do GitHub App de CD
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CD_APP_CLIENT_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Token (App; PAT até o fim da migração)
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.WISE_CD_REPO_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then token="$APP_TOKEN"; echo "Token: GitHub App"; else token="$PAT"; echo "::warning::Token: PAT (GitHub App não instalado ou não configurado neste repositório)"; fi
          echo "::add-mask::$token"
          echo "REPO_TOKEN=$token" >> "$GITHUB_ENV"
      - name: checkout
        uses: actions/checkout@v4
      - name: echo branch
        run:  |
         echo "IMAGE: "${IMAGE}" TAG: "${TAG}" ISSUE: "${ISSUE}
         scripts/update-task.sh $REPO_TOKEN set $ISSUE $IMAGE $TAG
